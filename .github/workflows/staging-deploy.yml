# A push to the git branch named staging runs the deploy script on the server.
#
# The script deploys /root/bevy-horilla-v2 from bevy-hr-portal-dev-2.0.
# It does not check out this branch and it does not start the v1 app.
# The copy of the script in the repo is docs/horilla-staging-deploy.sh.
#
# The runner connects outbound to GitHub. Inbound SSH from GitHub is not used.

name: Deploy staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, horilla-staging]
    timeout-minutes: 30
    steps:
      - name: Run the fixed deploy command on staging
        run: sudo -n /usr/local/sbin/horilla-staging-deploy
