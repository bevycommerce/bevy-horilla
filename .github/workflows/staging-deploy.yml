# Deploys the staging branch after a merge.
#
# The job runs on the staging server as the deploy user. That user can sudo
# only /usr/local/sbin/horilla-staging-deploy. The script pulls, rebuilds the
# app, and waits for /login/. entrypoint.sh runs migrate before gunicorn, so
# a new table in the merge is applied. The database volume is not recreated.
#
# The runner connects outbound to GitHub. Inbound SSH from GitHub is not used.

name: Deploy staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, horilla-staging]
    timeout-minutes: 20
    steps:
      - name: Run the fixed deploy command on staging
        run: sudo -n /usr/local/sbin/horilla-staging-deploy
