# A push to staging runs /usr/local/sbin/horilla-staging-deploy.
#
# The script fast-forwards /root/bevy-horilla-v2 to this staging branch and
# rebuilds project horilla-v2. It does not start the v1 app. Switch the script
# to this branch only after this commit is on origin/staging. Until then the
# installed script still builds bevy-hr-portal-dev-2.0.
#
# The runner connects outbound to GitHub. Inbound SSH from GitHub is not used.

name: Deploy staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, horilla-staging]
    timeout-minutes: 30
    steps:
      - name: Run the fixed deploy command on staging
        run: sudo -n /usr/local/sbin/horilla-staging-deploy
