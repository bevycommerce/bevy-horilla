services:
  server:
    container_name: horilla
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 80:8000
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:mysecretpassword@postgres:5432/horilla"
      ALLOWED_HOSTS: "hr-portal.bevycommerce.com"
      CSRF_TRUSTED_ORIGINS: "https://hr-portal.bevycommerce.com"
      TIME_ZONE: "America/Toronto"
      DEBUG: False
    command: sh ./entrypoint.sh
    volumes:
      - ./horilla:/app/horilla
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: postgres
    image: postgres:16-bullseye
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - horilla-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  horilla-data:
